server {
    listen 8080;
    server_name _;

    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

    # ALB Health Check
    location = /{{ .Release.Namespace }}/health {
        access_log off;
        return 200 "ok\n";
    }

    # /container-5 -> /container-5/
    location = /{{ .Release.Namespace }} {
        return 301 /{{ .Release.Namespace }}/;
    }

    # ChaoStock 웹 화면
    location = /{{ .Release.Namespace }}/ {
        alias /usr/share/nginx/html/index.html;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    # 주문 API
    location ^~ /{{ .Release.Namespace }}/api/ {
        set $order_upstream http://order.{{ .Release.Namespace }}.svc.cluster.local:8000;

        rewrite ^/{{ .Release.Namespace }}/api/(.*)$ /$1 break;
        proxy_pass $order_upstream;

        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # 실시간 시세 WebSocket
    location = /{{ .Release.Namespace }}/ws {
        proxy_pass http://127.0.0.1:8081/ws;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_connect_timeout 3s;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
