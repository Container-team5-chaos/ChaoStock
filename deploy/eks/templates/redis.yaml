apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: {{ .Values.ports.redis }}
      targetPort: redis

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      automountServiceAccountToken: false

      containers:
        # 1. Redis
        - name: redis
          image: "{{ .Values.images.redis.repository }}:{{ .Values.images.redis.tag }}"
          imagePullPolicy: IfNotPresent

          args:
            - "--save"
            - ""
            - "--appendonly"
            - "no"

          ports:
            - name: redis
              containerPort: {{ .Values.ports.redis }}

          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5

          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10

          resources:
            {{- toYaml .Values.resources.redis | nindent 12 }}
