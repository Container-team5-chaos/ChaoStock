apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: {{ .Values.ports.redis }}
      targetPort: redis

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      automountServiceAccountToken: false

      containers:
        # 1. Redis
        - name: redis
          image: "{{ .Values.images.redis.repository }}:{{ .Values.images.redis.tag }}"
          imagePullPolicy: IfNotPresent

          args:
            - "--save"
            - ""
            - "--appendonly"
            - "no"

          ports:
            - name: redis
              containerPort: {{ .Values.ports.redis }}

          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5

          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10

          resources:
            {{- toYaml .Values.resources.redis | nindent 12 }}

        # 2. Price Stub
        - name: price-stub
          image: "{{ .Values.images.redis.repository }}:{{ .Values.images.redis.tag }}"
          imagePullPolicy: IfNotPresent

          env:
            - name: MARKET
              value: {{ .Values.priceStub.market | quote }}
            - name: START_PRICE
              value: {{ .Values.priceStub.startPrice | quote }}

          command: ["sh", "-c"]
          args:
            - |
              KEY="price:$MARKET"
              price="$START_PRICE"

              echo "Starting price stub for $MARKET"

              while true; do
                response="$(redis-cli -h 127.0.0.1 --raw TIME 2>/dev/null)" || {
                  sleep 1
                  continue
                }

                set -- $response
                if [ "$#" -lt 2 ]; then
                  sleep 1
                  continue
                fi

                # Redis 서버 시각으로 밀리초 타임스탬프 생성
                ts=$(( $1 * 1000 + $2 / 1000 ))

                # 매초 운영체제 난수에서 독립적인 값 추출
                random_number="$(od -An -N4 -tu4 /dev/urandom | tr -d '[:space:]')"

                # 약 ±0.1% 범위의 가상 시세 변동
                price="$(awk -v p="$price" -v r="$random_number" \
                  'BEGIN { printf "%.0f", p * (1 + (r / 4294967295.0 - 0.5) / 500) }')"

                value="{\"price\":\"$price\",\"ts\":$ts,\"source\":\"stub\"}"

                if redis-cli -h 127.0.0.1 SET "$KEY" "$value" >/dev/null; then
                  redis-cli -h 127.0.0.1 PUBLISH "$KEY" "$value" >/dev/null
                  date +%s > /tmp/last_ok
                fi

                sleep 1
              done

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'test -f /tmp/last_ok && test $(( $(date +%s) - $(cat /tmp/last_ok) )) -lt 10'
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'test -f /tmp/last_ok && test $(( $(date +%s) - $(cat /tmp/last_ok) )) -lt 15'
            initialDelaySeconds: 25
            periodSeconds: 10

          resources:
            {{- toYaml .Values.resources.priceStub | nindent 12 }}
