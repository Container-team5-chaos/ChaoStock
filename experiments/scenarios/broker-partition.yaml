# 시나리오 형식 초안
# 증권사(mock-broker) 응답 유실: mock-broker → adapter 방향 패킷을 모두 버린다.
# 요청은 증권사에 도착해 처리될 수 있지만 adapter는 응답을 못 받고 시간 초과가 난다.
# = "체결은 됐는데 응답이 사라진" 상황
# 확인할 것: 단절 중 주문은 pending으로 남고(미체결로 단정하지 않음),
#           복구 뒤 같은 주문 키로 조회해 한 번만 체결·정산되는지 (중복 체결·이중 차감 없음)
#           MAX_ATTEMPTS(기본 8)를 넘기면 unknown이 되어 예약이 묶이므로 observe를 너무 길게 잡지 않는다
#
# 대상 라벨·보호 조건은 broker-delay.yaml과 같다.
name: broker-partition
# 주문 모드(w4 6번): adapter = 주문 서비스 → adapter → mock-broker. 실행기는 읽지 않고, infra/local/preflight.sh가 클러스터 설정과 맞는지 검사한다.
order_mode: adapter
# 판정 기준 구간에 맞춘 시간 (pod-kill과 같음, docs/results/2026-11-17-broker-load.md 다음 단계)
#   warmup 215 ≥ 판정 warmup 60 + baseline 150 + guard 2  → baseline 약 120건 (broker.yaml min_filled 60)
#   recover 185 ≥ 장애 후 여유 60 + tail 120
durations:   # 초
  warmup: 215
  observe: 30   # 리허설에서 unknown 0 (재시도 한도 안). 늘리지 않는다
  recover: 185

# 4번(adapter 부하): 0.8건/s (리허설로 확정)
load:
  profile: steady
  rate: 0.8
  duration_s: 730   # warmup + observe + recover + drain.timeout_s
  accounts: 30      # 매도 체결과 정산 순서 역전을 만들기 위해 계좌를 줄인다 (broker-delay.yaml 설명 참고)
faults:
  - kind: NetworkChaos
    spec:
      action: partition
      mode: all
      selector:
        namespaces: [exchange]
        labelSelectors:
          app: mock-broker
      direction: to
      target:
        mode: all
        selector:
          namespaces: [exchange]
          labelSelectors:
            app: adapter

# 시나리오 6 판정: adapter 대기열이 장애 중 쌓였다가 회복 후 평소 수준으로 빠지는지 본다(orchestrator/README.md)
drain:
  query: sum(adapter_queue_depth)
  timeout_s: 300

# 없으면 default.yaml로 판정해 0.8건/s에서는 표본 부족으로 늘 INCONCLUSIVE다
criteria: ../criteria/broker.yaml
