# 4번(adapter 부하) 기준선: broker 시나리오와 같은 부하를 같은 시간(420초) 동안 넣되 장애는 넣지 않는다.
# 확인할 것: 장애가 없는 구간에서도 pending(미정산 주문)이 쌓이는지
#   - pending이 평평함     → 이 rate로 broker 시나리오를 돌려도 된다. 장애 중 늘어난 적체는 장애 때문
#   - pending이 계속 늘어남 → 입력이 정산 처리량보다 빠르다. rate를 낮춰(0.4, 0.2 …) 다시 돌린다
# 기록: 실행 중 다른 터미널에서 infra/local/backlog-watch.sh 를 띄워 둔다
#
# faults가 비어 있어도 실행기는 warmup → observe → recover를 그대로 진행한다.
# drain은 넣지 않는다 (장애 구간이 없어 결과가 항상 INCONCLUSIVE(drain_unobserved)가 됨)
name: broker-baseline
durations:   # 초. 합계 420 = broker 시나리오의 k6 부하 시간
  warmup: 30
  observe: 360
  recover: 30

load:
  profile: steady
  rate: 0.8      # broker-delay, broker-partition과 같은 값으로
  duration_s: 420
  accounts: 300

faults: []
