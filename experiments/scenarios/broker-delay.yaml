# 시나리오 형식 초안
# 증권사(mock-broker) 응답 지연: mock-broker → adapter 방향 패킷만 2초 늦춘다.
# adapter의 BROKER_TIMEOUT_SECONDS(기본 5초)보다 짧아 시간 초과 없이 "느린 증권사"를 만든다.
# 확인할 것: 주문은 202로 바로 접수되고, 체결(filled)까지 시간이 늘어나도 중복·누락 없이 정산되는지
#
# 대상 라벨 app=mock-broker, app=adapter
# 주입기가 selector·target 모두에 보호 Pod·k6 제외 조건을 붙인다.
# target(adapter Pod IP)으로 범위를 좁혀 mock-broker의 다른 통신은 건드리지 않는다.
# (adapter → Service(ClusterIP) 방향은 Pod IP로 걸러지지 않아, 응답 방향인 mock-broker 쪽에 건다)
name: broker-delay
# 주문 모드(w4 6번): adapter = 주문 서비스 → adapter → mock-broker. 실행기는 읽지 않고, infra/local/preflight.sh가 클러스터 설정과 맞는지 검사한다.
order_mode: adapter
# 판정 기준 구간에 맞춘 시간 (pod-kill과 같음, docs/results/2026-11-17-broker-load.md 다음 단계)
#   warmup 215 ≥ 판정 warmup 60 + baseline 150 + guard 2  → baseline 약 120건 (broker.yaml min_filled 60)
#   recover 185 ≥ 장애 후 여유 60 + tail 120
durations:   # 초
  warmup: 215
  observe: 60
  recover: 185

# #4: Adapter 부하
load:
  profile: steady
  rate: 0.8            # 건/s (리허설로 확정: 장애 없을 때 1.6건/s까지 적체 없음)
  duration_s: 760      # warmup + observe + recover + drain.timeout_s. 대기열이 빠지는 동안에도 부하 유지
  # 0.8건/s에 계좌 300개면 계좌당 주문이 1건 남짓이라 보유가 쌓이지 않아 매도가 체결되지 않는다(sell_coverage).
  # 30개면 계좌당 약 20건 → 매수가 쌓이고 매도가 체결되며, 한 계좌에 pending이 겹쳐 정산 순서 역전(settle_seq)도 생긴다
  accounts: 30

faults:
  - kind: NetworkChaos
    spec:
      action: delay
      mode: all
      selector:
        namespaces: [exchange]
        labelSelectors:
          app: mock-broker
      direction: to
      target:
        mode: all
        selector:
          namespaces: [exchange]
          labelSelectors:
            app: adapter
      delay:
        latency: 2s
        jitter: 200ms
        correlation: "0"

# 시나리오 6 판정: adapter 대기열이 장애 중 쌓였다가 회복 후 평소 수준으로 빠지는지 본다(orchestrator/README.md)
drain:
  query: sum(adapter_queue_depth)
  timeout_s: 300

# 없으면 default.yaml로 판정해 0.8건/s에서는 표본 부족으로 늘 INCONCLUSIVE다
criteria: ../criteria/broker.yaml
