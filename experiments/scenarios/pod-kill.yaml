# 시나리오 형식 초안 (팀 합의 전)
name: pod-kill
durations:   # 초
  warmup: 30
  observe: 60
  recover: 30
faults:
  - kind: PodChaos
    spec:
      action: pod-kill
      mode: one
      selector:
        namespaces: [exchange]
        labelSelectors:
          app: order

# 없으면 default.yaml로 판정해 Pod가 안 죽어도 PASS가 난다
criteria: ../criteria/order-api-pod-kill.yaml
