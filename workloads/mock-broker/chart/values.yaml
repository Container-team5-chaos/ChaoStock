image:
  repository: chaos-lab-mock-broker
  tag: dev
  pullPolicy: IfNotPresent
database:
  secretName: postgres
  host: postgres
  port: 5432
config:
  redisUrl: redis://redis:6379/0
  staleMs: "5000"
  dbPoolSize: "5"
  responseDelaySeconds: "0"
  rateLimitRps: "0"
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 256Mi}
serviceMonitor:
  enabled: true
  interval: 5s
