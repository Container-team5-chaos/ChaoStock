{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mock-broker
  labels:
    {{- include "mock-broker.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "mock-broker.labels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
