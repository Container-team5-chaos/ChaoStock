apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-broker
  labels:
    {{- include "mock-broker.labels" . | nindent 4 }}
spec:
  # Fault rate limit is per process; avoid overlapping workers on rollout.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "mock-broker.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mock-broker.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: init-mock-broker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "mock_broker", "init-db"]
          envFrom:
            - secretRef: {name: {{ .Values.database.secretName }}}
          env:
            {{- include "mock-broker.env" . | nindent 12 }}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      containers:
        - name: mock-broker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - secretRef: {name: {{ .Values.database.secretName }}}
          env:
            {{- include "mock-broker.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
