default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: (^|/)templates/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, test, docs, infra, chore, ci]
  - repo: local
    hooks:
      # EKS 데모 차트(deploy/eks/files)의 사본이 원본(web/, workloads/order/db/)과 같은지 (scripts/check-eks-copies.sh)
      - id: eks-copies
        name: EKS 차트 사본 = 원본
        entry: bash scripts/check-eks-copies.sh
        language: system
        pass_filenames: false
        files: ^(web/index\.html|workloads/order/db/(schema|seed)\.sql|deploy/eks/files/.*)$
